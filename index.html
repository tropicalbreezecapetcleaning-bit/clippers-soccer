<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanguinetti Football Universe | Simulation</title><style>
:root{--bg:#071411;--panel:#10231e;--panel2:#152e27;--line:#2a493d;--text:#eff9f2;--muted:#9ab5a7;--gold:#eac568;--green:#36ce82;--red:#f07979}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#174531 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{border-bottom:1px solid var(--line);padding:20px max(22px,calc((100vw - 1320px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:#0b1c17e8}.brand{display:flex;gap:14px;align-items:center}.crest{width:55px;height:62px;display:grid;place-items:center;clip-path:polygon(50% 0,94% 15%,90% 76%,50% 100%,10% 76%,6% 15%);background:linear-gradient(140deg,var(--gold),#11734c);color:#071b12;font-weight:1000;font-size:22px;border:2px solid #fff}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:11px;font-weight:800;text-transform:uppercase}h1{margin:2px 0;font-size:25px;letter-spacing:-.6px}small,.muted{color:var(--muted)}.shell{max-width:1320px;margin:auto;padding:25px 20px 80px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 24px}.nav button{border:1px solid var(--line);background:#10231e;color:var(--muted);padding:12px 17px;border-radius:10px;cursor:pointer;font-weight:750}.nav button.active{background:var(--green);color:#062217;border-color:var(--green)}button,select,input{font:inherit}button{cursor:pointer}button.primary{background:var(--gold);color:#13231a;border:0;border-radius:10px;padding:12px 16px;font-weight:850}button.secondary{background:#224e3a;color:#fff;border:1px solid #3b7257;border-radius:10px;padding:11px 14px;font-weight:750}button.danger{background:#522e2e;color:#fff;border:1px solid #8e4d4d;border-radius:10px;padding:10px 14px}button:disabled{opacity:.4;cursor:not-allowed}select,input{background:#0a1c16;border:1px solid #47705b;color:white;border-radius:9px;padding:11px;max-width:100%}.hero{padding:24px 26px;background:linear-gradient(115deg,#17613f,#102e27 65%,#142c23);border:1px solid #3b805b;border-radius:18px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.hero h2{font-size:29px;margin:6px 0}.hero p{color:#c7dfd0;max-width:650px;margin:6px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1.25fr .85fr;gap:20px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px;min-width:0}.card h3{margin:0 0 15px;font-size:18px}.metric{background:#16372a;border:1px solid #2b5a42;border-radius:12px;padding:16px}.metric strong{display:block;font-size:26px;color:var(--gold)}.metric span{color:var(--muted);font-size:12px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:left}td,th{padding:10px 9px;border-bottom:1px solid #254337}tr:last-child td{border:0}td.num,th.num{text-align:right}tr.focus{background:#1c4432}tr.champ td:first-child{border-left:3px solid var(--gold)}.teammark{width:22px;height:22px;display:inline-grid;place-items:center;border-radius:50%;color:#05170f;font-size:10px;font-weight:900;margin-right:8px;vertical-align:middle}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #254337}.match:last-child{border:0}.match .right{text-align:right}.score{background:#1b4432;padding:7px 11px;border-radius:7px;color:var(--gold);font-weight:900;min-width:64px;text-align:center}.event{padding:9px 12px;border-left:3px solid var(--green);background:#153126;margin:9px 0;border-radius:0 8px 8px 0}.pill{display:inline-block;background:#234c39;border-radius:100px;color:#b7e5c9;padding:5px 10px;font-size:12px;font-weight:800}.player{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.player:last-child{border:0}.player .rating{color:var(--gold);font-weight:900}.bar{height:7px;border-radius:5px;background:#31503f;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green)}.formrow{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:15px}.formrow label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:14px;border:1px solid #577344;border-radius:12px;background:#253524;color:#e8e0b1}.hidden{display:none}.footer{text-align:center;color:var(--muted);margin-top:30px;font-size:12px}#toast{position:fixed;bottom:24px;right:24px;background:#d4edb4;color:#102519;padding:13px 18px;border-radius:10px;font-weight:800;box-shadow:0 15px 50px #0008;display:none;max-width:350px;z-index:10}@media(max-width:800px){.grid,.grid3,.two{grid-template-columns:1fr}.hero h2{font-size:23px}.shell{padding:16px 12px}.card{padding:15px}.match{font-size:13px}header{padding:15px}}
</style></head><body><header><div class="brand"><div class="crest">SYC</div><div><div class="eyebrow">Clarendon • Jamaica</div><h1>Sanguinetti Football Universe</h1><small>12-club interactive league simulation · Fictional prototype</small></div></div><div class="actions"><span class="pill" id="topSeason"></span><button class="secondary" onclick="exportSave()">Export Save</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import Save</button><input type="file" id="importFile" accept="application/json" class="hidden" onchange="importSave(event)"></div></header><main class="shell"><nav class="nav" id="nav"></nav><section id="content"></section><div class="footer">Sanguinetti Youth Club • Independent fictional football simulation • Autosaves in this browser</div></main><div id="toast"></div><script>
'use strict';
const KEY='syc-football-v1',NAMES=['Emerald Warriors FC','Golden Roots FC','Sanguinetti United','Clarendon Lions FC','Spaldings Athletic','Frankfield Rovers','May Pen City FC','Chapelton Stars','Kellits Rangers','Crofts Hill FC','Rock River United','Four Paths Eagles'];
const COLORS=['#25cb79','#dfba51','#5da4e4','#ef8d58','#8e92eb','#de7995','#55c6c4','#d1e17a','#a1bd85','#efc0a0','#aa85df','#6bc09a'];
const FIRST=['Andre','Malik','Dwayne','Ricardo','Jamal','Kemar','Dario','Omar','Shamar','Devonte','Tariq','Romaine','Kadeem','Jermaine','Damar','Tyrese','Nathan','Leon','Rohan','Micah','Keshawn','Akeem','Tyrell','Deshawn'];
const LAST=['Brown','Williams','Campbell','Johnson','Clarke','Thompson','Reid','Morgan','Davis','Grant','Henry','Lewis','Bennett','Robinson','McKenzie','Gordon','Smith','Francis','Wilson','Stewart'];
let state,tab='Overview',selectedClub=0,viewWeek=0;
function rng(seed){let x=seed>>>0;return()=>{x=(1664525*x+1013904223)>>>0;return x/4294967296}}
function rand(r,a,b){return Math.floor(r()*(b-a+1))+a}function money(n){return 'J$'+Math.round(n).toLocaleString('en-JM')}
function makeSchedule(n){let teams=Array.from({length:n},(_,i)=>i),rounds=[];for(let round=0;round<n-1;round++){let games=[];for(let j=0;j<n/2;j++){let a=teams[j],b=teams[n-1-j];games.push(round%2===0?[a,b]:[b,a])}rounds.push(games);teams=[teams[0],teams[n-1],...teams.slice(1,n-1)]}return [...rounds,...rounds.map(w=>w.map(([a,b])=>[b,a]))].map((games,week)=>games.map(([home,away])=>({id:`${week}-${home}-${away}`,week,home,away,score:null,events:[],stats:null})))}
function createGame(){let r=rng(20261026),clubs=NAMES.map((name,id)=>{let players=Array.from({length:20},(_,p)=>({id:id*100+p,name:FIRST[rand(r,0,FIRST.length-1)]+' '+LAST[rand(r,0,LAST.length-1)],position:p<2?'GK':p<8?'DEF':p<14?'MID':'FWD',rating:rand(r,47,76)+(id===0?3:0),potential:rand(r,72,95),age:rand(r,17,31),goals:0,assists:0}));return {id,name,color:COLORS[id],players,cash:id===0?2500000:rand(r,1400000,3500000),morale:rand(r,66,84),fitness:100,tactics:'Balanced',training:'Balanced',stadium:1,bus:1,academy:1,sponsor:rand(r,300000,800000),reputation:rand(r,30,60),history:[]}});return {version:1,season:2026,week:0,clubs,fixtures:makeSchedule(12),log:['Welcome to the Sanguinetti Football Universe. Season 2026 is ready.'],champions:[],manager:0,seed:20261026,completed:false}}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));state=v&&v.version===1&&v.clubs?.length===12?v:createGame()}catch(e){state=createGame()}selectedClub=state.manager;viewWeek=Math.min(state.week,21)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function notify(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',3500)}
function standings(){let rows=state.clubs.map(c=>({id:c.id,name:c.name,color:c.color,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));state.fixtures.flat().filter(f=>f.score).forEach(f=>{let h=rows[f.home],a=rows[f.away],x=f.score[0],y=f.score[1];h.p++;a.p++;h.gf+=x;h.ga+=y;a.gf+=y;a.ga+=x;if(x>y){h.w++;a.l++;h.pts+=3}else if(x<y){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}});return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name))}
function teamPower(c){let top=[...c.players].sort((a,b)=>b.rating-a.rating).slice(0,11);let avg=top.reduce((s,p)=>s+p.rating,0)/11;return avg+(c.morale-70)*.11+(c.fitness-80)*.06+(c.tactics==='Attacking'?1:c.tactics==='Defensive'?.5:0)+c.stadium*.3}
function poisson(r,lambda){let l=Math.exp(-lambda),p=1,k=0;do{k++;p*=r()}while(p>l&&k<15);return k-1}
function simulate(f){let home=state.clubs[f.home],away=state.clubs[f.away],r=rng((state.seed+state.season*7919+f.week*127+f.home*173+f.away*263)>>>0);let diff=teamPower(home)-teamPower(away);let attack=home.tactics==='Attacking'?.17:home.tactics==='Defensive'?-.16:0;let defend=away.tactics==='Attacking'?.17:away.tactics==='Defensive'?-.16:0;let hx=Math.max(.2,1.35+diff*.04+attack-defend),ax=Math.max(.2,1.1-diff*.04+defend-attack);let h=Math.min(8,poisson(r,hx)),a=Math.min(8,poisson(r,ax));let events=[];for(let [club,num] of [[home,h],[away,a]]){let scorers=club.players.filter(p=>p.position!=='GK');for(let k=0;k<num;k++){let p=scorers[rand(r,0,scorers.length-1)];p.goals++;events.push({minute:rand(r,1,90),club:club.id,player:p.name,type:'Goal'})}}events.sort((a,b)=>a.minute-b.minute);f.score=[h,a];f.events=events;f.stats={homeShots:Math.max(h,rand(r,5,16)),awayShots:Math.max(a,rand(r,4,15)),homePossession:Math.min(72,Math.max(28,Math.round(50+diff*.7+rand(r,-12,12))))};home.fitness=Math.max(65,home.fitness-rand(r,2,5));away.fitness=Math.max(65,away.fitness-rand(r,2,5));home.morale=Math.max(35,Math.min(100,home.morale+(h>a?3:h<a?-3:0)));away.morale=Math.max(35,Math.min(100,away.morale+(a>h?3:a<h?-3:0)));for(let c of [home,away]){c.cash+=Math.round((c.sponsor/22)+(c.id===f.home?rand(r,12000,42000):0)-rand(r,13000,32000));c.fitness=Math.min(100,c.fitness+2)}}
function playWeek(){if(state.week>=22)return;let w=state.week;state.fixtures[w].forEach(simulate);state.week++;viewWeek=w;let focus=state.fixtures[w].find(f=>f.home===state.manager||f.away===state.manager);state.log.unshift(`Matchweek ${w+1}: ${state.clubs[focus.home].name} ${focus.score[0]}–${focus.score[1]} ${state.clubs[focus.away].name}`);if(state.week===22){state.completed=true;let champ=standings()[0];state.champions.push({season:state.season,club:champ.name});state.log.unshift(`🏆 ${champ.name} are ${state.season} champions!`)}save();render();notify(state.week===22?'Season complete! View the champion and start a new season.':`Matchweek ${w+1} completed`)}
function nextSeason(){if(!state.completed)return;let r=rng(state.seed+state.season);state.clubs.forEach(c=>{c.history.push({season:state.season,position:standings().findIndex(x=>x.id===c.id)+1});c.players.forEach(p=>{p.age++;p.rating=Math.max(40,Math.min(95,p.rating+(p.age<26&&p.rating<p.potential?rand(r,0,2):p.age>31?-rand(r,0,2):0)));p.goals=0;p.assists=0});c.morale=75;c.fitness=100;c.cash+=c.sponsor;c.cash-=c.players.length*35000;c.reputation=Math.max(15,Math.min(100,c.reputation+rand(r,-2,3))) });state.season++;state.week=0;state.fixtures=makeSchedule(12);state.completed=false;state.seed+=991;viewWeek=0;state.log.unshift(`Season ${state.season} has begun.`);save();render();notify('New season started')}
function tableHTML(){let rows=standings();return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Club</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GD</th><th class="num">Pts</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${x.id===state.manager?'focus':''} ${i===0?'champ':''}"><td>${i+1}</td><td><span class="teammark" style="background:${x.color}">${x.name[0]}</span>${x.name}</td><td class="num">${x.p}</td><td class="num">${x.w}</td><td class="num">${x.d}</td><td class="num">${x.l}</td><td class="num">${x.gf-x.ga>0?'+':''}${x.gf-x.ga}</td><td class="num"><b>${x.pts}</b></td></tr>`).join('')}</tbody></table></div>`}
function matchesHTML(week){return state.fixtures[week].map(f=>`<div class="match"><div class="right">${state.clubs[f.home].name}</div><div class="score">${f.score?f.score.join(' – '):'vs'}</div><div>${state.clubs[f.away].name}</div></div>`).join('')}
function weekPicker(){return `<div class="formrow"><label>Matchweek<select onchange="viewWeek=+this.value;render()">${state.fixtures.map((_,i)=>`<option value="${i}" ${viewWeek===i?'selected':''}>Round ${i+1}${i<state.week?' • Played':''}</option>`).join('')}</select></label></div>`}
function overview(){let focus=state.clubs[state.manager],rank=standings().findIndex(x=>x.id===state.manager)+1;return `<section class="hero"><div><div class="eyebrow">Season ${state.season} · ${state.completed?'Completed':'Matchweek '+(state.week+1)+' of 22'}</div><h2>${state.completed?'🏆 Season Complete':'The Road to Glory Starts Here'}</h2><p>Manage your club, develop Jamaican football talent, and guide the 12-team competition through 132 fixtures.</p></div><div class="actions">${state.completed?`<button class="primary" onclick="nextSeason()">Start Season ${state.season+1} →</button>`:`<button class="primary" onclick="playWeek()">▶ Simulate Matchweek ${state.week+1}</button>`}<button class="secondary" onclick="setTab('Fixtures')">View Fixtures</button></div></section><div class="grid3"><div class="metric"><strong>${rank}<small> / 12</small></strong><span>${focus.name} league position</span></div><div class="metric"><strong>${state.week}<small> / 22</small></strong><span>Completed matchweeks</span></div><div class="metric"><strong>${money(focus.cash)}</strong><span>Club cash balance</span></div></div><div class="grid" style="margin-top:20px"><div class="card"><h3>Premier Division Standings</h3>${tableHTML()}</div><div><div class="card"><h3>${state.week===0?'Opening':'Latest'} Matchweek</h3>${matchesHTML(Math.max(0,state.week-1))}</div><div class="card"><h3>League News</h3>${state.log.slice(0,5).map(l=>`<div class="event">${l}</div>`).join('')}</div></div></div>`}
function fixturesPage(){return `<div class="hero"><div><div class="eyebrow">League Calendar</div><h2>Fixtures & Results</h2><p>22 matchweeks · 6 matches each · 132 fixtures per season.</p></div><div class="actions">${!state.completed?`<button class="primary" onclick="playWeek()">▶ Play Next Round</button><button class="secondary" onclick="playAll()">Simulate Full Season</button>`:''}</div></div><div class="grid"><div class="card"><h3>Matchweek ${viewWeek+1}</h3>${weekPicker()}${matchesHTML(viewWeek)}</div><div class="card"><h3>Match Details</h3>${state.fixtures[viewWeek].filter(f=>f.score).map(f=>`<details style="padding:12px 0;border-bottom:1px solid var(--line)"><summary style="cursor:pointer;font-weight:750">${state.clubs[f.home].name} ${f.score.join('–')} ${state.clubs[f.away].name}</summary><div class="muted" style="padding:10px 0">Shots: ${f.stats.homeShots}–${f.stats.awayShots} · Possession: ${f.stats.homePossession}%–${100-f.stats.homePossession}%</div>${f.events.length?f.events.map(e=>`<div class="event">${e.minute}' ⚽ ${e.player} — ${state.clubs[e.club].name}</div>`).join(''):'<p class="muted">No goals scored.</p>'}</details>`).join('')||'<p class="muted">Simulate this matchweek to see scores, goalscorers and match statistics.</p>'}</div></div>`}
function playAll(){if(!confirm('Simulate every remaining matchweek in this season?'))return;while(state.week<22)playWeekSilent();viewWeek=21;save();render();notify('Full season simulated')}
function playWeekSilent(){let w=state.week;state.fixtures[w].forEach(simulate);state.week++;if(state.week===22){state.completed=true;let champ=standings()[0];state.champions.push({season:state.season,club:champ.name});state.log.unshift(`🏆 ${champ.name} are ${state.season} champions!`)}}
function clubsPage(){return `<div class="hero"><div><div class="eyebrow">12 Independent Clubs</div><h2>League Club Directory</h2><p>Choose a club to inspect its squad, finances and infrastructure. Manage any club as commissioner.</p></div></div><div class="grid3">${state.clubs.map(c=>`<div class="card" style="border-top:4px solid ${c.color}"><div class="teammark" style="width:46px;height:46px;font-size:20px;background:${c.color}">${c.name[0]}</div><h3 style="margin:13px 0 6px">${c.name}</h3><div class="muted">Squad: ${c.players.length} · Strength: ${teamPower(c).toFixed(1)}</div><p class="muted">Budget: ${money(c.cash)}</p><div class="actions"><button class="secondary" onclick="selectedClub=${c.id};setTab('Club HQ')">View Club</button><button class="primary" onclick="manage(${c.id})">${state.manager===c.id?'Managing ✓':'Manage Club'}</button></div></div>`).join('')}</div>`}
function manage(id){state.manager=id;selectedClub=id;save();setTab('Club HQ');notify('Now managing '+state.clubs[id].name)}
function clubPage(){let c=state.clubs[selectedClub],s=[...c.players].sort((a,b)=>b.rating-a.rating);return `<div class="hero" style="border-color:${c.color}"><div><div class="eyebrow">Club Headquarters · ${state.manager===c.id?'Your Club':'League Club'}</div><h2>${c.name}</h2><p>Club power ${teamPower(c).toFixed(1)} · Reputation ${c.reputation}/100 · Stadium Level ${c.stadium}</p></div><div class="actions">${state.manager!==c.id?`<button class="primary" onclick="manage(${c.id})">Take Control</button>`:''}<select onchange="selectedClub=+this.value;render()">${state.clubs.map(x=>`<option value="${x.id}" ${x.id===selectedClub?'selected':''}>${x.name}</option>`).join('')}</select></div></div><div class="grid3"><div class="metric"><strong>${money(c.cash)}</strong><span>Club funds</span></div><div class="metric"><strong>${c.morale}%</strong><span>Squad morale</span></div><div class="metric"><strong>${c.fitness}%</strong><span>Team fitness</span></div></div><div class="grid" style="margin-top:20px"><div class="card"><h3>First-Team Squad</h3>${s.map(p=>`<div class="player"><div><b>${p.name}</b><div class="muted">${p.position} · Age ${p.age} · Goals ${p.goals}</div></div><span class="pill">${p.position}</span><span class="rating">${p.rating}</span></div>`).join('')}</div><div><div class="card"><h3>Tactics & Training</h3><div class="formrow"><label>Match Tactics<select ${state.manager!==c.id?'disabled':''} onchange="updateClub(${c.id},'tactics',this.value)">${['Balanced','Attacking','Defensive'].map(x=>`<option ${c.tactics===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Training Focus<select ${state.manager!==c.id?'disabled':''} onchange="updateClub(${c.id},'training',this.value)">${['Balanced','Fitness','Technical','Youth'].map(x=>`<option ${c.training===x?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="muted">Tactics affect match probabilities. Training focus is recorded for future player-development updates.</p></div><div class="card"><h3>Club Facilities</h3>${[['Stadium','stadium',750000],['Academy','academy',400000],['Team Bus','bus',350000]].map(([label,key,price])=>`<div style="padding:13px 0;border-bottom:1px solid var(--line)"><b>${label} · Level ${c[key]}</b><div class="muted" style="margin:6px 0">Next upgrade: ${money(price*c[key])}</div><button class="secondary" ${state.manager!==c.id||c.cash<price*c[key]||c[key]>=5?'disabled':''} onclick="upgrade(${c.id},'${key}',${price})">Upgrade</button></div>`).join('')}</div><div class="card"><h3>Rename Club</h3><div class="formrow"><label>Club Name<input id="rename" maxlength="45" value="${escapeHtml(c.name)}" ${state.manager!==c.id?'disabled':''}></label><button class="secondary" ${state.manager!==c.id?'disabled':''} onclick="renameClub(${c.id})">Save Name</button></div><p class="muted">The founding identities can be retained while placeholder clubs are renamed.</p></div></div></div>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function updateClub(id,key,value){if(state.manager!==id)return;state.clubs[id][key]=value;save();notify(key+' updated')}
function upgrade(id,key,price){if(state.manager!==id)return;let c=state.clubs[id],cost=price*c[key];if(c.cash<cost||c[key]>=5)return;c.cash-=cost;c[key]++;if(key==='academy')c.players.forEach(p=>{if(p.age<23&&p.rating<p.potential)p.rating=Math.min(p.potential,p.rating+1)});save();render();notify('Upgrade complete: '+key+' level '+c[key])}
function renameClub(id){if(state.manager!==id)return;let value=document.getElementById('rename').value.trim();if(value.length<3)return notify('Name must be at least 3 characters');state.clubs[id].name=value;save();render();notify('Club renamed')}
function recordsPage(){let goals=state.clubs.flatMap(c=>c.players.map(p=>({...p,club:c.name}))).sort((a,b)=>b.goals-a.goals).slice(0,15);return `<div class="hero"><div><div class="eyebrow">History & Statistics</div><h2>League Records</h2><p>Track the Golden Boot, champions and league history across seasons.</p></div></div><div class="two"><div class="card"><h3>Golden Boot Race</h3><div class="tablewrap"><table><tr><th>Player</th><th>Club</th><th class="num">Goals</th></tr>${goals.map(p=>`<tr><td>${p.name}</td><td>${p.club}</td><td class="num">${p.goals}</td></tr>`).join('')}</table></div></div><div><div class="card"><h3>Championship History</h3>${state.champions.length?state.champions.map(x=>`<div class="event">🏆 ${x.season}: ${x.club}</div>`).join(''):'<p class="muted">No completed seasons yet. Play through all 22 matchweeks to crown the first champion.</p>'}</div><div class="card"><h3>League Rules</h3><p>12 clubs · 22 matchweeks · 132 matches · home and away.</p><p>Win = 3 points · Draw = 1 point · Loss = 0 points.</p><p class="muted">Tie-breakers: goal difference, then goals scored, then alphabetical order for the prototype.</p></div></div></div>`}
function settingsPage(){return `<div class="hero"><div><div class="eyebrow">Commissioner Control</div><h2>Save & Simulation Settings</h2><p>Manage the local simulation, export it for your developer or import a previous save.</p></div></div><div class="card"><h3>Game Status</h3><p>Season ${state.season} · ${state.week}/22 matchweeks · ${state.clubs.length} clubs · ${state.fixtures.flat().filter(x=>x.score).length} completed matches.</p><div class="actions"><button class="primary" onclick="exportSave()">Download Save JSON</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import Save JSON</button><button class="danger" onclick="resetGame()">Reset Entire Simulation</button></div></div><div class="notice"><b>Prototype scope:</b> All teams, scores and player names are fictional. This edition has working standings, seeded match simulation, club tactics, facilities, budgets and multi-season saves. Player transfers, contracts, scouting, 2D matches, multiple divisions and cloud multiplayer are planned extensions, not active features.</div>`}
function resetGame(){if(!confirm('Erase your current local simulation and start over? Export your save first if you want to keep it.'))return;state=createGame();selectedClub=0;viewWeek=0;save();setTab('Overview');notify('New game created')}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`sanguinetti-season-${state.season}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function importSave(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let s=JSON.parse(reader.result);if(s.version!==1||s.clubs?.length!==12||s.fixtures?.length!==22)throw Error('Invalid save format');state=s;selectedClub=state.manager;viewWeek=Math.max(0,state.week-1);save();render();notify('Save imported successfully')}catch(err){alert('Unable to import: '+err.message)}};reader.readAsText(file);e.target.value=''}
const tabs=['Overview','Fixtures','Clubs','Club HQ','Records','Settings'];function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){document.getElementById('topSeason').textContent=`SEASON ${state.season} · ROUND ${Math.min(22,state.week+1)}/22`;document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');document.getElementById('content').innerHTML=({Overview:overview,Fixtures:fixturesPage,Clubs:clubsPage,'Club HQ':clubPage,Records:recordsPage,Settings:settingsPage})[tab]()}load();render();
</script></body></html>
